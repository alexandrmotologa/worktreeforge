[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worktreeforge"
version = "0.1.0"
description = "High-speed Git worktree supervisor, stash studio, and local dev server port multiplexer with merged PR auto cleanup."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@users.noreply.github.com" }
]
keywords = [
    "git",
    "git-worktree",
    "developer-tools",
    "port-multiplexer",
    "stash",
    "tui",
    "textual",
    "fastapi"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "watchfiles>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[project.scripts]
worktreeforge = "worktreeforge.cli.main:app"
wtf = "worktreeforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
